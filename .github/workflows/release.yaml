name: Release

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Lets the release action create tags and GitHub releases
      pull-requests: read # Reads the pull requests that the release notes link to
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create release
        id: release
        uses: logica-oss/actions-toolkit/release@497746a5e6d64835c883466163470ed7d71502b8 # v1.2.1
        with:
          initial-version: v0.1.0
          create-release: "false"

  goreleaser:
    name: GoReleaser
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # Lets GoReleaser upload the release assets
      id-token: write # Lets attest mint an OIDC token for Sigstore signing
      attestations: write # Lets attest persist the provenance attestation
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Download Syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Add Syft to PATH
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: dirname "${SYFT_CMD}" >> "${GITHUB_PATH}"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/*_checksums.txt

  floating-tags:
    name: Floating tags
    needs: [release, goreleaser]
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Lets the job move the floating major/minor tags
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Move floating tags
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail

          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Skipping floating tags for non-stable tag: ${TAG}"
            exit 0
          fi

          major="${TAG%%.*}"
          minor="$(printf '%s' "${TAG}" | cut -d. -f1,2)"
          sha="$(git rev-parse "${TAG}^{commit}")"
          git tag -f "${major}" "${sha}"
          git tag -f "${minor}" "${sha}"
          git push --force origin "refs/tags/${major}" "refs/tags/${minor}"
