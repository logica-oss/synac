name: autofix.ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: autofix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    name: Autofix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sync Agent Config
        uses: logica-oss/actions-toolkit/sync-agent-config@778580083dcb3b0ac6c1ac3bbcb902794b9e0acc # v1.0.0
      - name: Autofix Text
        uses: logica-oss/actions-toolkit/autofix-text@778580083dcb3b0ac6c1ac3bbcb902794b9e0acc # v1.0.0
