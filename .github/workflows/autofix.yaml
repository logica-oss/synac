name: autofix.ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: autofix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  autofix:
    name: Autofix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache Go
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-tools-${{ hashFiles('go.sum', 'tools/go.sum') }}
          restore-keys: go-${{ runner.os }}-tools-
      - name: Setup Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Tidy
        run: task tidy
      - name: Lint with fix
        run: task lint-fix || true
      - name: Format
        run: task format
      - name: Sync Agent Config
        run: task run || true
      - name: Autofix Text
        uses: logica-oss/actions-toolkit/autofix-text@5c92317e3cd93cc23a2c8c25e82e23783b18f186 # v1.1.1
