version: 3

# Task definition order
#
# 1.
#   desc
#
# 2.
#   internal
#   dir
#   silent
#
# 3.
#   vars
#   status / sources / generates / methods / preconditions
#   deps
#
# 4.
#   cmds

vars:
  GO_PACKAGES: ./... ./tools/...

tasks:
  check-binary:
    desc: Check if the binary exists
    internal: true
    silent: true
    cmds:
      - |
        if ! (type {{.BINARY}} >/dev/null 2>&1); then
          echo "Install \"{{if .ALT_NAME}}{{.ALT_NAME}}{{else}}{{.BINARY}}{{end}}\" and rerun this task."
          echo {{.INSTALL_DOC}}
          exit 1
        fi

  lint:
    desc: Lint
    deps:
      - task: check-binary
        vars:
          BINARY: go
          INSTALL_DOC: https://go.dev/doc/install
    cmds:
      - go tool golangci-lint run --fix {{.GO_PACKAGES}}

  format:
    desc: Format
    deps:
      - task: check-binary
        vars:
          BINARY: go
          INSTALL_DOC: https://go.dev/doc/install
    cmds:
      - go tool golangci-lint fmt {{.GO_PACKAGES}}

  build:
    desc: Build
    deps:
      - task: check-binary
        vars:
          BINARY: go
          INSTALL_DOC: https://go.dev/doc/install
    cmds:
      - go build ./cmd/synac/*.go

  test:
    desc: Test
    deps:
      - task: check-binary
        vars:
          BINARY: go
          INSTALL_DOC: https://go.dev/doc/install
    cmds:
      - go test -v ./...

  tidy:
    desc: Tidy
    deps:
      - task: check-binary
        vars:
          BINARY: go
          INSTALL_DOC: https://go.dev/doc/install
    cmds:
      - go tool tidy

  default:
    desc: RUn all tasks
    cmds:
      - task: tidy
      - task: format
      - task: lint
      - task: test
      - task: build
