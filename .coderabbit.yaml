language: "en-US"

reviews:
  profile: assertive
  request_changes_workflow: true

  path_filters:
    - "!.github/skills/**"
    - "!.github/instructions/**"
    - "!.github/copilot-instructions.md"

  auto_review:
    enabled: true
    drafts: false
    ignore_usernames:
      - "renovate[bot]"
      - "mergify[bot]"

  path_instructions:
    - path: "pkg/sync/skills.go"
      instructions: "Removing the destination when the skills source directory is missing is intentional: deletions are part of the sync. Do not suggest returning early before RemoveAll."
    - path: "pkg/sync/path_specific.go"
      instructions: "Removing the destination when the path-specific source directory is missing is intentional: deletions are part of the sync. Do not suggest returning early before RemoveAll."
    - path: "pkg/sync/*.go"
      instructions: "Keep sync writes direct without staging directories or atomic rename; partial-output risk on conversion failure is accepted for simplicity."
    - path: "pkg/config/load.go"
      instructions: "A missing explicitly configured file must surface as a read error; do not suggest ignoring it as a missing config."
    - path: "pkg/md/instructions.go"
      instructions: "Keep quote handling simple without strconv.Unquote decoding; escaped quotes and backslashes in glob values are accepted as-is for simplicity."
